
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>

    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>

</head>

<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <p>
            Nombre:
            <input type="text"
                   placeholder="Ingrese su nombre"
                   maxlength="40"
                   size="40">
        </p>

        <p>
            Apellido:
            <input type="text"
                   placeholder="Ingrese su apellido"
                   maxlength="40"
                   size="40">
        </p>

        <p>
            Sexo:

            <input type="radio"
                   name="sexo"
                   placeholder="Masculino">

            Masculino

            <input type="radio"
                   name="sexo"
                   placeholder="Femenino">

            Femenino
        </p>

        <p>
            Edad:

            <input type="number"
                   placeholder="Ingrese su edad"
                   maxlength="3">
        </p>

        <p>
            Email:

            <input type="email"
                   placeholder="Ingrese su email"
                   maxlength="100"
                   size="40">
        </p>

        <p>
            Usuario:

            <input type="text"
                   placeholder="Ingrese su usuario"
                   maxlength="30"
                   size="40">
        </p>

        <p>
            Password:

            <input type="password"
                   placeholder="Ingrese su contraseña"
                   maxlength="30"
                   size="40">
        </p>

        <p>
            Confirmar Password:

            <input type="password"
                   placeholder="Confirme su contraseña"
                   maxlength="30"
                   size="40">
        </p>

        <p>
            Tipo de servicio:

            <select>
                <option>Free</option>
                <option>Standard</option>
                <option>Premium</option>
            </select>
        </p>

        <p>
            Tema:
        </p>

        <p>
            <input type="checkbox"
                   placeholder="Política">

            Política
        </p>

        <p>
            <input type="checkbox"
                   placeholder="Negocios">

            Negocios
        </p>

        <p>
            <input type="checkbox"
                   placeholder="Tecnología">

            Tecnología
        </p>

        <p>
            <input type="checkbox"
                   placeholder="Salud">

            Salud
        </p>

        <p>
            Agregue un comentario:
        </p>

        <p>
            <textarea
                placeholder="Escriba su comentario"
                maxlength="500"
                rows="5"
                cols="40">
            </textarea>
        </p>

        <p>
            <input type="submit"
                   value="Enviar">
        </p>

    </form>

</body>

</html>
